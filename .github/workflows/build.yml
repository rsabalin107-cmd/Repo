name: Build RPK
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build projects
        run: |
          shopt -s nullglob
          found=0
          for z in *.zip; do
            found=1
            name="${z%.zip}"
            name="${name// /_}"
            mkdir -p "out/$name"
            unzip -o "$z" -d "out/$name"
            (cd "out/$name" && npm install && npx aiot build)
          done
          if [ "$found" = 0 ]; then echo "No zip files in repo root"; exit 1; fi
          find out -name "*.rpk" -not -path "*/node_modules/*"
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: |
            out/*/dist/*.rpk
          if-no-files-found: error
